# Alembic configuration for StemSpace (P2-001 scaffold).
#
# There is deliberately NO `sqlalchemy.url` here: alembic/env.py takes the URL
# from backend/app/config.py (DEC-0005 §7), so no connection string or password
# is ever committed and DATABASE_URL is never echoed. Do not add a sqlalchemy.url
# line, and do not point this at a production database — local Compose Postgres
# only.
#
# Migrations are never auto-run at app or container startup; they are invoked
# deliberately. `versions/` is intentionally empty in P2-001: this task adds the
# scaffold only, and the first revision arrives with the domain models (P2-002).

[alembic]
script_location = alembic
prepend_sys_path = .
# Split path options on the OS separator. Set explicitly because newer Alembic
# deprecates the legacy fallback; older versions in our range simply ignore it.
path_separator = os

# Logging. sqlalchemy.engine stays at WARN so connection URLs are never echoed
# into logs (DEC-0005 §7).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
