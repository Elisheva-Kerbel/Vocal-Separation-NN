# StemSpace — local development (Docker Compose, Phase 0 skeleton).
#
# Compose-first local dev (see docs/decisions/DEC-0001). Services reach each
# other by service name — postgres, redis, minio, backend, worker, frontend —
# on Compose's default network, never via localhost.
#
# Phase 0 scope: infrastructure services, a minimal backend that serves
# GET /health only (P0-003), and a worker *startup stub* that only proves the
# worker image can import project code and stay alive (P0-004) — it runs NO
# queue / job processing and opens NO connections. There is still NO frontend UI
# (the Vite shell arrives in P0-005). The worker and frontend commands below are
# clearly marked Phase 0 startup stubs.
#
# Before `docker compose up`, copy .env.example -> .env (see README.md).
# .env holds local placeholders only — never real secrets. Every value below
# also has a safe local default so `docker compose config` works without .env.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stemspace}
      POSTGRES_USER: ${POSTGRES_USER:-stemspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # No volume: for the MVP, Redis is a transient Celery broker/result backend;
    # local dev does not need to persist its state (kept minimal per DEC-0002).

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_local_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_local_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    image: stemspace-backend:local
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Runs the FastAPI /health app via the image CMD (uvicorn on 0.0.0.0:8000).
    # Host port ${BACKEND_PORT} maps to the container's fixed 8000 (see ports).
    # /health opens no connections; depends_on only orders startup.

  worker:
    # Reuses the backend image built above to avoid duplicated dependency
    # definitions (TASK-P0-002 / 05-architecture-and-stack). No separate build.
    image: stemspace-backend:local
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis
      - minio
    # Phase 0 worker startup stub (P0-004): runs the worker module, which prints
    # one safe line and idles. No queue client, no polling loop, no connections.
    command: ["python", "-m", "app.worker"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    # Phase 0 Vite + React empty shell (P0-005). The image CMD runs the Vite dev
    # server bound to 0.0.0.0:5173; the host FRONTEND_PORT maps to it. No
    # env_file and no depends_on: the shell needs no config, makes no backend API
    # calls, and must never receive backend/storage secrets, the DB or Redis
    # URLs, or internal service URLs. FRONTEND_PORT for the host mapping above is
    # resolved from the top-level .env by Compose interpolation, not the service
    # environment.

volumes:
  postgres_data:
  minio_data:
