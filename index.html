const LESSONS = [
  // -- Chapter 1: Architecture --
  {
    id: 'intro',
    chapter: 'סקירה כללית',
    title: 'מה זה VocalSplit?',
    file: null,
    content: `
<p>VocalSplit היא פלטפורמת הפרדת שירים מבוססת AI. משתמש מעלה שיר, והמערכת מפרידה אותו לשני ערוצים נפרדים: <strong>שירה</strong> (Vocals) ו<strong>מוזיקה</strong> (Background).</p>

<h2>טכנולוגיות הפרויקט</h2>
<p>
<span class="tech-badge">Python 3.12</span>
<span class="tech-badge">FastAPI</span>
<span class="tech-badge">SQLAlchemy 2</span>
<span class="tech-badge">PostgreSQL</span>
<span class="tech-badge">Celery</span>
<span class="tech-badge">Redis</span>
<span class="tech-badge">MinIO / S3</span>
<span class="tech-badge">React 18</span>
<span class="tech-badge">Vite 5</span>
<span class="tech-badge">Docker Compose</span>
<span class="tech-badge">PyTorch</span>
</p>

<h2>ארכיטקטורה</h2>
<p>המערכת בנויה מ-7 קונטיינרים שרצים ביחד דרך Docker Compose:</p>
<div class="arch-diagram">
  <div class="arch-box highlight"><div class="name">Frontend</div><div class="tech">React + Vite<br>Port 5173</div></div>
  <div class="arch-box highlight"><div class="name">Backend</div><div class="tech">FastAPI<br>Port 8000</div></div>
  <div class="arch-box highlight"><div class="name">Worker</div><div class="tech">Celery<br>AI Processing</div></div>
  <div class="arch-box"><div class="name">PostgreSQL</div><div class="tech">Database<br>Port 5432</div></div>
  <div class="arch-box"><div class="name">Redis</div><div class="tech">Message Broker<br>Port 6379</div></div>
  <div class="arch-box"><div class="name">MinIO</div><div class="tech">File Storage (S3)<br>Port 9000</div></div>
  <div class="arch-box"><div class="name">Adminer</div><div class="tech">DB Admin UI<br>Port 8080</div></div>
</div>

<h2>הזרימה המלאה: מהעלאה ועד האזנה</h2>
<ol>
<li><strong>משתמש מעלה שיר</strong> - הקובץ נשלח מ-React דרך XHR אל ה-Backend</li>
<li><strong>Backend שומר ב-MinIO</strong> - הקובץ נשמר באחסון S3, ונוצרות רשומות ב-DB (Song, AudioFile, SeparationJob)</li>
<li><strong>משימה נשלחת ל-Celery</strong> - דרך Redis כ-Message Broker</li>
<li><strong>Worker מריץ את ההפרדה</strong> - מוריד מ-MinIO, מריץ מודל AI, מעלה את התוצאות בחזרה</li>
<li><strong>משתמש מאזין</strong> - ה-Frontend מקבל Signed URLs מהבאקאנד ומשמיע את הקבצים</li>
</ol>

<div class="concept">
<div class="concept-label">מושג מפתח: Signed URLs</div>
קבצי האודיו לעולם לא חשופים ישירות. כל גישה לקובץ דורשת URL חתום עם תוקף מוגבל (10 דקות להאזנה, 5 דקות להורדה). ככה אין גישה ישירה לאחסון.
</div>
`

  {
    id: 'docker',
    chapter: 'סקירה כללית',
    title: 'Docker Compose - כל השירותים',
    file: 'docker-compose.yml',
    content: `
<p>Docker Compose מאפשר להרים את כל 7 השירותים בפקודה אחת. כל שירות רץ בקונטיינר נפרד, וכולם מתקשרים דרך רשת פנימית של Docker.</p>

<div class="concept">
<div class="concept-label">מושג: Docker Compose</div>
כלי שמנהל מספר קונטיינרים (containers) של Docker ביחד. במקום להריץ כל שירות בנפרד, קובץ YAML אחד מגדיר הכל: איזה images להריץ, איזה ports לפתוח, ואיזה volumes לחבר.
</div>

<h2>הגדרת בסיס הנתונים</h2>
$CODE_YAML$
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: \${POSTGRES_DB:-stemspace}
      POSTGRES_USER: \${POSTGRES_USER:-stemspace}
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "\${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
$END_CODE$

<div class="annotation"><strong>image: postgres:16-alpine</strong> - גרסה קלה של PostgreSQL 16. Alpine Linux היא הפצת לינוקס מינימלית שחוסכת מקום. <code>\${POSTGRES_DB:-stemspace}</code> אומר: "קח מקובץ .env, אם אין - השתמש ב-stemspace". <strong>volumes</strong> שומר את הנתונים גם כשהקונטיינר נעצר.</div>

<h2>Backend ו-Worker</h2>
$CODE_YAML$
  backend:
    build:
      context: ./backend
    image: stemspace-backend:local
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "\${BACKEND_PORT:-8000}:8000"

  worker:
    image: stemspace-backend:local     # אותו Image כמו Backend!
    depends_on:
      - postgres
      - redis
      - minio
    command: ["celery", "-A", "app.celery_app", "worker",
              "--loglevel=info", "-Q", "separation,celery",
              "--concurrency=2"]
$END_CODE$

<div class="annotation"><strong>image: stemspace-backend:local</strong> - ה-Worker משתמש באותו Image בדיוק כמו ה-Backend! ההבדל היחיד הוא ה-<code>command</code> - במקום להריץ את FastAPI, הוא מריץ את Celery שמאזין לתור המשימות. <strong>depends_on</strong> מבטיח שהשירותים האחרים יעלו קודם.</div>

<h2>Frontend</h2>
$CODE_YAML$
  frontend:
    build:
      context: ./frontend
    ports:
      - "\${FRONTEND_PORT:-5173}:5173"
$END_CODE$

<div class="annotation">ה-Frontend רץ על <strong>Vite dev server</strong> בפורט 5173. Vite מפנה את כל הקריאות ל-API אל ה-Backend (proxy) - כך הדפדפן מדבר רק עם Frontend, ו-Frontend מעביר את הבקשות הלאה.</div>

<h2>Volumes - שמירת נתונים</h2>
$CODE_YAML$
volumes:
  postgres_data:    # נתוני בסיס הנתונים
  minio_data:       # קבצי האודיו

$END_CODE$

<p>קובץ ההגדרות מרכז את כל משתני הסביבה (Environment Variables) במקום אחד. שום קובץ אחר בפרויקט לא קורא ישירות מ-<code>os.getenv</code>.</p>

<div class="concept">
<div class="concept-label">מושג: Dataclass</div>
<code>dataclass</code> הוא decorator של Python שיוצר class עם constructor אוטומטי. <code>frozen=True</code> הופך אותו ל-immutable - אחרי שנוצר, אי אפשר לשנות את הערכים שלו. זה מונע באגים שבהם מישהו משנה הגדרה בטעות תוך כדי ריצה.
</div>

$CODE_PYTHON$
from dataclasses import dataclass, field

@dataclass(frozen=True)
class Settings:
    """Immutable snapshot of local configuration."""

    app_env: str
    backend_host: str
    backend_port: int
    s3_endpoint_url: str
    s3_public_endpoint_url: str
    s3_bucket: str
    s3_region: str
    # field(repr=False) - הערך לא ייראה בלוגים!
    s3_access_key_id: str = field(repr=False)
    s3_secret_access_key: str = field(repr=False)
    database_url: str = field(repr=False)
$END_CODE$

<div class="annotation"><strong>field(repr=False)</strong> - כש-Python מדפיס את האובייקט (למשל בלוג), הסיסמאות והמפתחות לא ייראו. זה עיקרון אבטחה חשוב: סודות לעולם לא מופיעים ב-log.</div>

<h2>טעינת הגדרות מסביבה</h2>
$CODE_PYTHON$
def load_settings() -> Settings:
    return Settings(
        app_env=os.getenv("APP_ENV", "local"),
        backend_port=int(os.getenv("BACKEND_PORT", "8000")),
        s3_endpoint_url=os.getenv("S3_ENDPOINT_URL", ""),
        database_url=os.getenv("DATABASE_URL", ""),
        free_daily_limit=int(os.getenv("FREE_DAILY_LIMIT", "3")),

        # ... ועוד
    )
$END_CODE$

<div class="annotation"><strong>os.getenv("APP_ENV", "local")</strong> - קרא את משתנה הסביבה APP_ENV. אם הוא לא קיים, השתמש ב-"local" כברירת מחדל. הפונקציה מחזירה <code>Settings</code> חדש עם כל הערכים.</div>

<h2>גישה בטוחה ל-Database URL</h2>
$CODE_PYTHON$
class MissingDatabaseUrlError(RuntimeError):
    """הערך לא מופיע בהודעת השגיאה - לעולם לא לחשוף סיסמאות"""

def require_database_url(settings: Settings | None = None) -> str:
    url = (settings or load_settings()).database_url
    if not url.strip():
        raise MissingDatabaseUrlError(
            "DATABASE_URL is not set. Set it in your local .env file."
        )
    return url
$END_CODE$

<div class="annotation">שימו לב: הודעת השגיאה אומרת <em>מה</em> חסר, אבל לעולם <strong>לא מדפיסה את הערך עצמו</strong>. ה-Database URL מכיל סיסמה, ואסור שהיא תופיע בשום log או traceback.</div>

<p>זה הקובץ שמפעיל את שרת ה-API. הוא יוצר אפליקציית FastAPI, מגדיר CORS, ומחבר את כל ה-Routers.</p>

<div class="concept">
<div class="concept-label">מושג: FastAPI</div>
FastAPI הוא framework ל-Python לבניית REST APIs. הוא מבוסס על Type Hints של Python, יוצר תיעוד אוטומטי, ומהיר מאוד. בניגוד ל-Flask, הוא asynchronous מובנה ומשתמש ב-Pydantic לוולידציה.
</div>

$CODE_PYTHON$
from fastapi import Depends, FastAPI
from fastapi.middleware.cors import CORSMiddleware

app = FastAPI(title="VocalSplit Backend", version="0.1.0")

# CORS - מאפשר ל-Frontend (port 5173) לדבר עם Backend (port 8000)
app.add_middleware(
    CORSMiddleware,
    allow_origins=["http://localhost:5173"],
    allow_credentials=True,   # שליחת cookies
    allow_methods=["*"],
    allow_headers=["*"],
)
$END_CODE$

<div class="annotation"><strong>CORS (Cross-Origin Resource Sharing)</strong> - הדפדפן חוסם בקשות בין דומיינים שונים כברירת מחדל. כי ה-Frontend רץ על port 5173 וה-Backend על 8000, צריך להגיד לבאקאנד במפורש: "תאפשר בקשות מ-5173". בלי זה, כל קריאת API תיכשל.</div>

<h2>חיבור כל ה-Routers</h2>
$CODE_PYTHON$
# כל Router אחראי על קבוצת endpoints
app.include_router(auth_router)     # /auth/signup, /auth/login, ...
app.include_router(upload_router)   # /upload
app.include_router(songs_router)    # /songs/{id}, /songs/{id}/status, ...
app.include_router(library_router)  # /library
app.include_router(public_router)   # /public/library, /public/songs/{id}
app.include_router(admin_router)    # /admin/users, /admin/reports, ...
$END_CODE$

<div class="annotation"><strong>Router</strong> ב-FastAPI זה כמו "תת-אפליקציה". במקום לכתוב את כל ה-endpoints בקובץ אחד ענק, כל תחום מקבל Router משלו בקובץ נפרד. <code>include_router</code> מחבר את כולם לאפליקציה הראשית.</div>

<h2>Endpoints בסיסיים</h2>
$CODE_PYTHON$
@app.get("/health")
def health() -> dict[str, str]:
    return {"status": "ok", "service": SERVICE_NAME}

@app.get("/quota")
def quota_info(
    user: User = Depends(current_user),     # חייב להיות מחובר
    db: DbSession = Depends(get_db),        # מקבל חיבור ל-DB
):
    return get_usage_info(db, user)
$END_CODE$

<div class="annotation"><strong>Depends()</strong> - מנגנון <strong>Dependency Injection</strong> של FastAPI. במקום שהפונקציה תיצור בעצמה חיבור ל-DB או תבדוק אימות, FastAPI מזריק את הדברים האלה אוטומטית. <code>Depends(current_user)</code> בודק שה-cookie תקין ומחזיר את המשתמש. אם הוא לא מחובר, FastAPI מחזיר 401 לפני שהפונקציה בכלל רצה.</div>
`

<p>קובץ קצר אבל קריטי - הוא מגדיר את ה-Base class שממנו יורשים כל המודלים של בסיס הנתונים.</p>

<div class="concept">
<div class="concept-label">מושג: ORM (Object-Relational Mapping)</div>
SQLAlchemy הוא ORM - הוא ממפה בין טבלאות ב-DB לבין classes ב-Python. במקום לכתוב SQL ידנית, אתם יוצרים class שמייצג טבלה, ו-SQLAlchemy מתרגם את הפעולות ל-SQL. למשל: <code>User(email="a@b.com")</code> הופך ל-<code>INSERT INTO users (email) VALUES ('a@b.com')</code>.
</div>

$CODE_PYTHON$
from sqlalchemy import MetaData
from sqlalchemy.orm import DeclarativeBase

# כללי שמות עקביים לכל ה-constraints
NAMING_CONVENTION = {
    "ix": "ix_%(column_0_label)s",           # Index
    "uq": "uq_%(table_name)s_%(column_0_name)s",  # Unique
    "ck": "ck_%(table_name)s_%(constraint_name)s",  # Check
    "fk": "fk_%(table_name)s_%(column_0_name)s_%(referred_table_name)s",  # FK
    "pk": "pk_%(table_name)s",               # Primary Key
}

class Base(DeclarativeBase):
    metadata = MetaData(naming_convention=NAMING_CONVENTION)
$END_CODE$

<div class="annotation"><strong>NAMING_CONVENTION</strong> - כשה-DB יוצר index או constraint, הוא בוחר שם אוטומטי. בלי כלל שמות, כל DB בוחר שם אחר, ו-Alembic (כלי המיגרציות) מתבלבל. עם כללים אחידים, השמות תמיד צפויים.</div>

<h2>מה זה DeclarativeBase?</h2>
<p>כל class שיורש מ-<code>Base</code> הופך לטבלה ב-DB. ה-<code>metadata</code> הוא אובייקט ש"זוכר" את כל הטבלאות, ו-Alembic משתמש בו כדי לייצר מיגרציות אוטומטית.</p>
`

    id: 'db-session',

    title: 'session.py - חיבור ל-Database',

    content: `
<p>הקובץ הזה מנהל את החיבור ל-PostgreSQL. עיקרון מפתח: <strong>הכל נטען עצלנית (lazily)</strong> - שום חיבור לא נפתח עד שמישהו באמת צריך אותו.</p>

$CODE_PYTHON$
from sqlalchemy import Engine, create_engine
from sqlalchemy.orm import Session, sessionmaker

from app.config import require_database_url

# נוצר רק בקריאה הראשונה, לא ב-import
_engine: Engine | None = None
_session_factory: sessionmaker[Session] | None = None

def get_engine() -> Engine:
    global _engine
    if _engine is None:
        _engine = create_engine(require_database_url())
    return _engine

def get_sessionmaker() -> sessionmaker[Session]:
    global _session_factory
    if _session_factory is None:
        _session_factory = sessionmaker(bind=get_engine())
    return _session_factory
$END_CODE$

<div class="annotation"><strong>Lazy Loading</strong> - ה-engine נוצר רק כשמישהו קורא ל-<code>get_engine()</code> בפעם הראשונה. זה אומר ש-<code>import</code> של המודול לא פותח חיבור, ולכן הטסטים יכולים לרוץ בלי DB אמיתי, ו-endpoint כמו <code>/health</code> עובד גם בלי PostgreSQL.</div>

<div class="concept">
<div class="concept-label">מושג: Session ו-Engine</div>
<strong>Engine</strong> = "המנוע" שמתחבר ל-DB ומנהל pool של חיבורים. נוצר פעם אחת.<br>
<strong>Session</strong> = "שיחה" אחת עם ה-DB. כל בקשת HTTP מקבלת session משלה, עושה query, ובסוף ה-session נסגר. זה מונע בעיות של נעילות ושל מידע מעורבב בין בקשות.
</div>
`

<p>המודל המרכזי של המערכת - כל משתמש רשום מיוצג ע"י class זה. הוא מגדיר את הטבלה <code>users</code> ב-PostgreSQL.</p>

$CODE_PYTHON$
class User(CreatedAtMixin, UpdatedAtMixin, Base):
    __tablename__ = "users"

    id: Mapped[uuid.UUID] = mapped_column(
        Uuid, primary_key=True, default=uuid.uuid4
    )
    email: Mapped[str] = mapped_column(
        String(320), nullable=False, unique=True
    )
    status: Mapped[str] = mapped_column(
        String(32), nullable=False, default="active"
    )
    password_hash: Mapped[str] = mapped_column(
        String(255), nullable=False
    )
    role: Mapped[str] = mapped_column(
        String(32), nullable=False,
        default="free", server_default="free"
    )
    tier: Mapped[str] = mapped_column(
        String(16), nullable=False,
        default="free", server_default="free"
    )
$END_CODE$

<div class="annotation">
<strong>Mapped[uuid.UUID]</strong> - Type hint של SQLAlchemy 2.x שאומר: "העמודה הזו מכילה UUID". <code>mapped_column</code> מגדיר את המאפיינים: <code>primary_key=True</code> = מפתח ראשי, <code>unique=True</code> = אי אפשר שני משתמשים עם אותו אימייל, <code>nullable=False</code> = חובה למלא.<br><br>
<strong>default vs server_default</strong> - <code>default="free"</code> עובד ב-Python (כש-SQLAlchemy יוצר את האובייקט). <code>server_default="free"</code> עובד ב-DB (כשעושים INSERT ישירות ב-SQL). שניהם ביחד מבטיחים שהערך תמיד יהיה "free" אם לא ציינו אחרת.
</div>

<h2>Relationships - קשרים בין טבלאות</h2>
$CODE_PYTHON$
    songs: Mapped[list["Song"]] = relationship(
        back_populates="owner"
    )
    daily_usage: Mapped[list["DailyUsage"]] = relationship(
        back_populates="user"
    )
$END_CODE$

<div class="annotation"><strong>relationship</strong> - מגדיר קשר One-to-Many. למשתמש אחד יכולים להיות הרבה שירים. <code>back_populates="owner"</code> אומר שב-Song יש שדה <code>owner</code> שמצביע בחזרה למשתמש. ככה אפשר לעבור בשני הכיוונים: <code>user.songs</code> ו-<code>song.owner</code>.</div>

<h2>Check Constraints - הגנה ברמת ה-DB</h2>
$CODE_PYTHON$
    __table_args__ = (
        CheckConstraint(
            "status IN ('active', 'blocked', 'deleted')",
            name="status_allowed"
        ),
        CheckConstraint(
            "tier IN ('free', 'pro')",
            name="tier_allowed"
        ),
    )
$END_CODE$

<div class="annotation"><strong>CheckConstraint</strong> - הגנה ברמת בסיס הנתונים. גם אם יש באג בקוד Python שמנסה לשמור <code>tier="super"</code>, ה-DB יסרב. זו שכבת הגנה נוספת מעבר ל-Enum בקוד.</div>
`

<p>הקובץ הכי רגיש בפרויקט מבחינת אבטחה. הוא אחראי על הצפנת סיסמאות באלגוריתם <strong>scrypt</strong> ועל אימות שלהן.</p>

<div class="concept">
<div class="concept-label">מושג: Password Hashing</div>
לעולם לא שומרים סיסמה כטקסט רגיל! במקום זה, מריצים אלגוריתם חד-כיווני (hash) שהופך את הסיסמה למחרוזת ארוכה. כשמשתמש מתחבר, מריצים את אותו אלגוריתם על מה שהקליד ובודקים אם התוצאה תואמת. גם אם ה-DB נפרץ, התוקף מקבל רק hash ולא את הסיסמאות עצמן.
</div>

$CODE_PYTHON$
import base64, hashlib, hmac, secrets

SCRYPT_N = 2**14   # עלות חישוב: 16,384 איטרציות
SCRYPT_R = 8       # גודל בלוק
SCRYPT_P = 1       # מקביליות
SCRYPT_DKLEN = 32  # אורך התוצאה: 32 בתים
SALT_BYTES = 16    # salt אקראי: 16 בתים

def hash_password(password: str) -> str:
    salt = secrets.token_bytes(SALT_BYTES)  # 16 בתים אקראיים
    derived = hashlib.scrypt(
        password.encode("utf-8"),
        salt=salt, n=SCRYPT_N, r=SCRYPT_R, p=SCRYPT_P, dklen=SCRYPT_DKLEN,
    )
    # שומרים הכל ביחד: אלגוריתם + פרמטרים + salt + hash
    return (
        f"scrypt\${SCRYPT_N}\${SCRYPT_R}\${SCRYPT_P}\$"
        f"{base64.b64encode(salt).decode()}\$"
        f"{base64.b64encode(derived).decode()}"
    )
$END_CODE$

<div class="annotation">
<strong>Salt</strong> - מספר אקראי שמתווסף לכל סיסמה. בלי salt, שני משתמשים עם אותה סיסמה יקבלו אותו hash, ותוקף יוכל להשתמש ב-"rainbow table" מוכנה מראש. עם salt ייחודי לכל סיסמה, זה בלתי אפשרי.<br><br>
<strong>הפורמט</strong>: <code>scrypt$16384$8$1$[salt_base64]$[hash_base64]</code> - הפרמטרים נשמרים יחד עם ה-hash, כדי שאם נעלה את העלות בעתיד, הסיסמאות הישנות עדיין יאומתו בהצלחה.
</div>

<h2>אימות סיסמה - Constant Time</h2>
$CODE_PYTHON$
def verify_password(password: str, stored_hash: str) -> bool:
    try:
        algorithm, n, r, p, salt_b64, hash_b64 = stored_hash.split("$")
        if algorithm != "scrypt":
            return False
        salt = base64.b64decode(salt_b64)
        expected = base64.b64decode(hash_b64)
        derived = hashlib.scrypt(
            password.encode("utf-8"),
            salt=salt, n=int(n), r=int(r), p=int(p), dklen=len(expected),
        )
    except (ValueError, TypeError, MemoryError):
        return False
    # השוואה בזמן קבוע - מונע timing attack!
    return hmac.compare_digest(derived, expected)
$END_CODE$

<div class="annotation"><strong>hmac.compare_digest</strong> - השוואה ב"זמן קבוע". השוואה רגילה (<code>==</code>) מפסיקה ברגע שמוצאת תו שונה, מה שמאפשר לתוקף לגלות כמה תווים הוא ניחש נכון לפי זמן התגובה (timing attack). <code>compare_digest</code> תמיד לוקח אותו זמן.</div>

<h2>Non-Enumerating Login</h2>
$CODE_PYTHON$
# סיסמה מזויפת: כשמייל לא קיים, עדיין מריצים hash כדי שזמן
# התגובה יהיה זהה - תוקף לא יכול לדעת אם המייל קיים או לא
_DUMMY_PASSWORD_HASH = hash_password(secrets.token_urlsafe(16))
$END_CODE$

<div class="annotation">אם משתמש מנסה להתחבר עם מייל שלא קיים, המערכת עדיין מריצה hash (על הסיסמה המזויפת) כדי שזמן התגובה יהיה זהה. בלי זה, תוקף יכול לבדוק אילו אימיילים רשומים ואילו לא.</div>
`

<div class="concept-label">מושג: httpOnly Cookie</div>
Cookie שמסומן כ-httpOnly לא נגיש מ-JavaScript בדפדפן. זה אומר שגם אם יש פירצת XSS באתר, הסקריפט הזדוני לא יכול לגנוב את ה-cookie. רק הדפדפן שולח אותו אוטומטית עם כל בקשה.

$CODE_PYTHON$
SESSION_COOKIE_NAME = "stemspace_session"
SESSION_TTL = datetime.timedelta(days=7)  # תוקף: 7 ימים

def create_session_token() -> str:
    """Token אקראי בן 256 ביט - מוחזר פעם אחת, לעולם לא נשמר"""

<h2>הגדרת ה-Cookie</h2>
$CODE_PYTHON$
def set_auth_cookie(response: Response, token: str) -> None:
    response.set_cookie(
        SESSION_COOKIE_NAME,
        token,
        max_age=int(SESSION_TTL.total_seconds()),
        httponly=True,      # לא נגיש מ-JavaScript
        samesite="lax",     # הגנה מ-CSRF
        secure=_cookie_secure(),  # HTTPS only (חוץ מ-local)
        path="/",
    )
$END_CODE$

<h2>current_user - ה-Guard של כל route מוגן</h2>
$CODE_PYTHON$
def current_user(
    request: Request, db: DbSession = Depends(get_db)
) -> User:
    token = request.cookies.get(SESSION_COOKIE_NAME)
    if not token:
        raise _not_authenticated()  # 401

    session = _lookup_session(db, token)
    if session is None:
        raise _not_authenticated()  # 401

    user = db.get(User, session.user_id)
    if user.status == UserStatus.BLOCKED:
        raise _error(403, "account_blocked", "...")

    # בדיקת תפוגת מנוי Pro
    if user.tier == UserTier.PRO and user.subscription_expires_at:
        if _as_utc(user.subscription_expires_at) <= _now():
            user.tier = UserTier.FREE  # שדרוג אוטומטי למטה
            db.commit()

    return user
$END_CODE$

<div class="annotation">זו הפונקציה שמגנה על כל ה-endpoints שדורשים משתמש מחובר. היא: (1) מוציאה את ה-cookie מהבקשה, (2) מחפשת את ה-hash שלו ב-DB, (3) בודקת שהמשתמש לא חסום, (4) בודקת אם המנוי פג ומורידה לחינם אם כן. כל endpoint שכותב <code>user: User = Depends(current_user)</code> מקבל את כל ההגנות האלה אוטומטית.</div>

<p>זה הלב של הפרויקט - רשת נוירונים מסוג <strong>U-Net</strong> שמפרידה שירה ממוזיקה. המודל מקבל ספקטרוגרמה (ייצוג ויזואלי של אודיו) ומחזיר mask שמסמן "איפה השירה".</p>

<div class="concept">
<div class="concept-label">מושג: U-Net</div>
ארכיטקטורת רשת נוירונים בצורת U. היא <strong>מכווצת</strong> (encoder) את הקלט לייצוג קטן, ואז <strong>מרחיבה</strong> (decoder) אותו בחזרה לגודל המקורי. ה-"U" בשם בא מהצורה: המידע זורם למטה (כיווץ) ואז למעלה (הרחבה), עם <strong>skip connections</strong> - קיצורי דרך שמחברים ישירות בין הכיווץ להרחבה, כדי לא לאבד פרטים.
</div>

$CODE_PYTHON$
# קבועים שתואמים את אופן האימון
SAMPLE_RATE = 22050     # דגימות לשנייה
N_FFT = 1024            # חלון FFT
HOP_LENGTH = 256        # צעד בין חלונות
INPUT_CHANNELS = 1      # ספקטרוגרמה בערוץ אחד
MASK_CHANNELS = 1       # mask פלט בערוץ אחד
$END_CODE$

<div class="annotation"><strong>STFT (Short-Time Fourier Transform)</strong> - הופך אודיו מגל קול (amplitude over time) לספקטרוגרמה (frequency over time). ה-N_FFT קובע את רזולוציית התדר, ו-HOP_LENGTH קובע את רזולוציית הזמן. כמו לפרק אור לקשת צבעים, אבל עם צלילים.</div>

<h2>הרשת עצמה</h2>
$CODE_PYTHON$
class SmallUNet(nn.Module):
    def __init__(self):
        super().__init__()
        # Encoder - מכווץ: 1 -> 16 -> 32 ערוצים
        self.enc1 = conv_block(INPUT_CHANNELS, 16)
        self.enc2 = conv_block(16, 32)
        self.pool = nn.MaxPool2d(kernel_size=2)

        # Bottleneck - הנקודה הצרה: 64 ערוצים
        self.bottleneck = conv_block(32, 64)

        # Decoder - מרחיב בחזרה: 64+32 -> 32, 32+16 -> 16
        self.dec2 = conv_block(64 + 32, 32)   # 64 מלמטה + 32 מ-skip
        self.dec1 = conv_block(32 + 16, 16)   # 32 מלמטה + 16 מ-skip

        # שכבת פלט: ערוץ mask אחד
        self.out_conv = nn.Conv2d(16, MASK_CHANNELS, kernel_size=1)

    def forward(self, x):
        e1 = self.enc1(x)              # 1 -> 16 ערוצים
        e2 = self.enc2(self.pool(e1))  # 16 -> 32 (חצי גודל)
        b = self.bottleneck(self.pool(e2))  # 32 -> 64 (רבע גודל)

        d2 = self.dec2(self._up_to(b, e2))  # 64+32=96 -> 32
        d1 = self.dec1(self._up_to(d2, e1)) # 32+16=48 -> 16

        mask = torch.sigmoid(self.out_conv(d1))  # [0, 1]
        return mask
$END_CODE$

<div class="annotation">
<strong>conv_block</strong> - שתי שכבות Conv2d + ReLU. כל שכבה "רואה" אזור 3x3 של הספקטרוגרמה.<br>
<strong>MaxPool2d(2)</strong> - מקטין את הגודל בחצי לכל כיוון.<br>
<strong>_up_to(b, e2)</strong> - מגדיל את b לגודל של e2 ומחבר אותם (skip connection).<br>
<strong>sigmoid</strong> - דוחף כל ערך לטווח [0, 1]. ערך 1 = "כאן יש שירה", 0 = "כאן אין שירה".<br><br>
התוצאה: mask של שירה. כופלים את ה-mask בספקטרוגרמה המקורית כדי לקבל את ערוץ השירה, ו-(1 - mask) כדי לקבל את המוזיקה.
</div>
`

export function useLang(user) {

    // עדיפות: העדפת המשתמש > localStorage > ברירת מחדל
    if (user?.preferred_language) return user.preferred_language
    return localStorage.getItem('vocalsplit_lang') || 'he'
  })

  useEffect(() => {
    localStorage.setItem('vocalsplit_lang', lang)
    document.documentElement.lang = lang
    // RTL לעברית, LTR לאנגלית
    document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr'
  }, [lang])

  // פונקציית התרגום: מחפשת בשפה הנוכחית, fallback לעברית
  const t = (key) => (T[lang] || T.he)[key] || T.he[key] || key
  return { lang, setLang, t }
}
$END_CODE$

<div class="annotation"><strong>dir = 'rtl'</strong> - כשהשפה עברית, כל ה-CSS מתהפך אוטומטית: טקסט ימינה, sidebar בצד ימין, וכו'. <code>document.documentElement</code> מצביע על תגית <code>&lt;html&gt;</code>. פונקציית <code>t</code> מחפשת קודם בשפה הנוכחית, ואם לא מוצאת - חוזרת לעברית, ואם גם שם אין - מחזירה את ה-key עצמו.</div>

<p>שכבת ה-API של הפרונטאנד - פונקציות שמתקשרות עם ה-Backend. כל הקריאות ל-<code>/auth/*</code> מרוכזות כאן.</p>

$CODE_JAVASCRIPT$
const BASE = '/auth'
const MIN_PASSWORD_LENGTH = 8

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    credentials: 'same-origin',  // שליחת cookies!
  })
  if (!res.ok) {
    const data = await res.json().catch(() => ({}))
    throw new Error(data.message || data.detail?.message || 'Error')
  }
  return res.json()
}
$END_CODE$

<div class="annotation"><strong>credentials: 'same-origin'</strong> - אומר ל-fetch לשלוח cookies עם הבקשה. בלי זה, ה-httpOnly session cookie לא יישלח וה-Backend לא יזהה את המשתמש. זה חיוני למערכת ה-auth כולה.</div>

<h2>פונקציות ה-Auth</h2>
$CODE_JAVASCRIPT$
export async function signUp(email, password) {
  return post(BASE + '/signup', { email, password })
}

export async function signIn(email, password) {
  return post(BASE + '/login', { email, password })
}

export async function currentUser() {
  const res = await fetch(BASE + '/me', { credentials: 'same-origin' })
  if (!res.ok) return null  // לא מחובר = null, לא שגיאה
  return res.json()
}

export async function forgotPassword(email) {
  return post(BASE + '/forgot-password', { email })
}

export async function resetPassword(token, password) {
  return post(BASE + '/reset-password', { token, password })
}
$END_CODE$

<div class="annotation"><strong>currentUser</strong> - מוחזרת <code>null</code> אם המשתמש לא מחובר (במקום לזרוק שגיאה). ככה ב-<code>App.jsx</code> אפשר לכתוב פשוט <code>if (user)</code> לבדוק אם מחובר. <strong>forgotPassword</strong> ו-<strong>resetPassword</strong> - חלק מזרימת איפוס הסיסמה שנוספה לאחרונה.</div>

// frontend/src/api/songs.js
export function uploadSong(file, model, visibility, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest()
    const form = new FormData()
    form.append('file', file)
    form.append('model_choice', model)     // "basic" / "professional"
    form.append('visibility', visibility)  // "private" / "public"
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress(e.loaded / e.total)
    }
    xhr.open('POST', '/upload')
    xhr.withCredentials = true
    xhr.send(form)
  })
}

# backend/app/auth/routes.py
@router.post("/auth/login")
def login(body: LoginRequest, response: Response, db = Depends(get_db)):
    user = db.scalars(
        select(User).where(User.email == body.email)
    ).first()

    # Non-enumerating: אם המייל לא קיים, עדיין מריצים hash
    stored = user.password_hash if user else _DUMMY_PASSWORD_HASH
    if not verify_password(body.password, stored):
        raise api_error(401, "invalid_credentials", "...")

    if user.status != UserStatus.ACTIVE:
        raise api_error(403, "account_blocked", "...")

    # יצירת session חדש
    _start_session(db, user, response)  # מגדיר cookie
    return AuthUserRead.model_validate(user, from_attributes=True)

def _start_session(db, user, response):
    token = create_session_token()  # 256 ביט אקראי
    db.add(UserSession(
        user_id=user.id,
        token_hash=hash_session_token(token),  # SHA-256
        expires_at=_now() + SESSION_TTL,  # +7 ימים
    ))
    db.commit()
    set_auth_cookie(response, token)  # httpOnly cookie

@router.post("/auth/logout")
def logout(request: Request, response: Response, db = Depends(get_db)):
    token = request.cookies.get(SESSION_COOKIE_NAME)
    if token:

<p>סיכום של כל עקרונות האבטחה שראינו לאורך הקורס:</p>

<h2>סיסמאות</h2>
<ul>
<li><strong>scrypt hashing</strong> - אלגוריתם שדורש הרבה זיכרון, קשה ל-brute force</li>
<li><strong>Salt ייחודי</strong> - לכל סיסמה salt אקראי משלה</li>
<li><strong>Constant-time comparison</strong> - <code>hmac.compare_digest</code> מונע timing attacks</li>
<li><strong>Non-enumerating login</strong> - אי אפשר לגלות אילו אימיילים רשומים</li>
</ul>

<h2>Sessions</h2>
<ul>
<li><strong>httpOnly cookies</strong> - JavaScript לא יכול לגשת ל-cookie (הגנה מ-XSS)</li>
<li><strong>SameSite=Lax</strong> - הגנה מ-CSRF</li>
<li><strong>SHA-256 token hash</strong> - רק ה-hash נשמר ב-DB, לא ה-token</li>
<li><strong>7-day TTL</strong> - תוקף מוחלט, בלי הארכה אוטומטית</li>
</ul>

<h2>אחסון</h2>
<ul>
<li><strong>Signed URLs</strong> - גישה מוגבלת בזמן לקבצים</li>
<li><strong>storage_key לעולם לא נחשף</strong> - ה-API מחזיר signed URL, לא את הנתיב ב-S3</li>
<li><strong>CORS מוגבל</strong> - רק localhost:5173 מורשה</li>
</ul>

<h2>הגדרות</h2>
<ul>
<li><strong>field(repr=False)</strong> - סודות לא מופיעים ב-logs</li>
<li><strong>DATABASE_URL לעולם לא ב-error</strong> - הודעות שגיאה לא מכילות ערכים</li>
<li><strong>קובץ .env לא ב-git</strong> - סודות נשארים מקומיים</li>
</ul>

<div class="concept-label">עיקרון מנחה: Defense in Depth</div>
כל שכבה מגנה בעצמה, בלי לסמוך על שכבות אחרות. StrEnum מגן בקוד, CheckConstraint מגן ב-DB, repr=False מגן בלוגים, Signed URLs מגנים על קבצים. גם אם שכבה אחת נפרצת, השאר ממשיכות להגן.

<li><strong>Pydantic</strong> - ספריית validation. בודק שהנתונים שמגיעים מהלקוח בפורמט הנכון</li>
<li><strong>Celery</strong> - מנהל משימות אסינכרוניות. ה-Backend שולח משימה, ו-Worker מריץ אותה ברקע</li>
<li><strong>Redis</strong> - מסד נתונים בזיכרון. כאן משמש כ-Message Broker בין Backend ל-Worker</li>
<li><strong>PostgreSQL</strong> - מסד נתונים רלציוני. שומר משתמשים, שירים, סשנים, וכו'</li>
<li><strong>MinIO / S3</strong> - אחסון אובייקטים. שומר קבצי אודיו. S3 = AWS, MinIO = תחליף מקומי</li>
<li><strong>Dependency Injection</strong> - דפוס שבו פונקציה מקבלת את מה שהיא צריכה מבחוץ (Depends) במקום ליצור בעצמה</li>
<li><strong>Middleware</strong> - שכבה שרצה על כל בקשה, לפני ה-endpoint. CORS middleware מוסיף headers</li>
</ul>

<h2>Frontend</h2>

// Group lessons by chapter
function getChapters() {
  const map = new Map();
  LESSONS.forEach((l, i) => {
    if (!map.has(l.chapter)) map.set(l.chapter, []);
    map.get(l.chapter).push({ ...l, index: i });
  });
  return map;
}

// State
let currentIndex = 0;
let completed = new Set();
try {
  const saved = localStorage.getItem('vs_completed');
  if (saved) completed = new Set(JSON.parse(saved));
} catch(e){}

function saveCompleted() {
  try { localStorage.setItem('vs_completed', JSON.stringify([...completed])); } catch(e){}
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const chapters = getChapters();
  let html = '';
  for (const [chapter, lessons] of chapters) {
    const allDone = lessons.every(l => completed.has(l.id));
    html += '<div class="chapter-group">';
    html += '<div class="chapter-title open" onclick="toggleChapter(this)"><span class="arrow">&#9654;</span> ' + chapter + (allDone ? ' &#10003;' : '') + '</div>';
    html += '<div class="chapter-lessons">';
    lessons.forEach(l => {
      const active = l.index === currentIndex ? 'active' : '';
      const done = completed.has(l.id) ? 'done' : '';
      html += '<button class="lesson-link ' + active + '" onclick="goTo(' + l.index + ')">';
      html += '<span class="check ' + done + '">' + (done ? '&#10003;' : '') + '</span>';
      html += l.title + '</button>';
    });
    html += '</div></div>';
  }
  nav.innerHTML = html;
  updateProgress();
}

function updateProgress() {
  const total = LESSONS.length;
  const done = completed.size;
  document.getElementById('progressText').textContent = done + ' / ' + total;
  document.getElementById('progressFill').style.width = (done / total * 100) + '%';
}

function toggleChapter(el) {
  el.classList.toggle('open');
  const lessons = el.nextElementSibling;
  lessons.classList.toggle('collapsed');
}

function processContent(raw) {
  let html = raw;
  // Replace $CODE_LANG$...$END_CODE$ with code blocks
  html = html.replace(/\$CODE_(\w+)\$([\s\S]*?)\$END_CODE\$/g, (_, lang, code) => {
    const langName = {PYTHON:'Python',JAVASCRIPT:'JavaScript',YAML:'YAML',CSS:'CSS',DOCKERFILE:'Dockerfile'}[lang] || lang;
    const trimmed = code.replace(/^\n/, '').replace(/\n$/, '');
    return '<div class="code-block"><div class="code-header"><span>' + langName + '</span></div><pre><code class="language-' + lang.toLowerCase() + '">' + escapeHtml(trimmed) + '</code></pre></div>';
  });
  return html;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderLesson(index) {
  currentIndex = index;
  const lesson = LESSONS[index];
  const main = document.getElementById('mainContent');

  let html = '<div class="lesson-header">';
  html += '<div class="lesson-chapter">' + lesson.chapter + '</div>';
  html += '<h1 class="lesson-title">' + lesson.title + '</h1>';
  if (lesson.file) {
    html += '<div class="lesson-file"><span class="icon">&#128196;</span> ' + lesson.file + '</div>';
  }
  html += '</div>';

  html += '<div class="lesson-body">' + processContent(lesson.content) + '</div>';

  // Nav
  html += '<div class="lesson-nav">';
  if (index > 0) {
    html += '<button class="nav-btn" onclick="goTo(' + (index-1) + ')">&#8594; ' + LESSONS[index-1].title + '</button>';
  } else {
    html += '<span></span>';
  }
  const isDone = completed.has(lesson.id);
  html += '<button class="complete-btn ' + (isDone ? 'is-done' : '') + '" onclick="markComplete(\'' + lesson.id + '\')">' + (isDone ? '&#10003; הושלם' : 'סמן כהושלם') + '</button>';
  if (index < LESSONS.length - 1) {
    html += '<button class="nav-btn primary" onclick="goTo(' + (index+1) + ')">' + LESSONS[index+1].title + ' &#8592;</button>';
  } else {
    html += '<span></span>';
  }
  html += '</div>';

  main.innerHTML = html;
  main.scrollTop = 0;
  window.scrollTo(0, 0);

  // Highlight code
  main.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

  renderSidebar();

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
}

function goTo(index) {
  renderLesson(index);
}

function markComplete(id) {
  if (completed.has(id)) return;
  completed.add(id);
  saveCompleted();
  renderLesson(currentIndex);
}

// Mobile toggle
document.getElementById('mobileToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

// Init
renderLesson(0);
</script>
